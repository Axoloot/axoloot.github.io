<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e0e0f">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Speed Motor</title>
<style>
  :root {
    --bg:#0e0e0f; --card:#1a1a1c; --line:#2a2a2d; --fg:#f4f4f5; --dim:#8a8a90;
    --red:#e63b2e; --green:#2fc26b; --amber:#f0a020;
  }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { margin:0; background:var(--bg); color:var(--fg);
    font-family:-apple-system, system-ui, "Segoe UI", sans-serif; }
  body { padding:16px; padding-top:max(14px, env(safe-area-inset-top));
    padding-bottom:max(16px, env(safe-area-inset-bottom)); max-width:480px; margin:0 auto; }

  /* top bar: connection */
  .top { display:flex; align-items:center; justify-content:space-between; gap:12px; }
  .conn { display:flex; align-items:center; gap:8px; font-size:14px; color:var(--dim); min-width:0; }
  .conn span { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .dot { width:10px; height:10px; border-radius:50%; background:var(--dim); flex:none; }
  .dot.ok { background:var(--green); } .dot.busy { background:var(--amber); } .dot.err { background:var(--red); }
  .right { display:flex; align-items:center; gap:10px; flex:none; }
  .batRow { display:flex; align-items:center; gap:16px; }
  .bat { color:var(--dim); }
  .batIcon { position:relative; width:52px; height:26px; border:3px solid currentColor; border-radius:6px; }
  .batIcon::after { content:""; position:absolute; right:-8px; top:6px; width:4px; height:8px;
    background:currentColor; border-radius:0 2px 2px 0; }
  .batIcon i { position:absolute; left:2px; top:2px; bottom:2px; width:0; border-radius:2px; background:currentColor;
    transition:width .3s; }
  .bat.ok { color:var(--green); } .bat.mid { color:var(--amber); } .bat.low { color:var(--red); }
  .batPct { font-size:28px; font-weight:800; font-variant-numeric:tabular-nums; line-height:1; }
  .batSub { color:var(--dim); font-size:14px; margin-top:4px; }
  .linkBtn { flex:none; border:1px solid var(--line); background:var(--card); color:var(--fg);
    font-size:14px; font-weight:600; padding:9px 14px; border-radius:10px; }

  /* speed */
  .speedBox { text-align:center; margin:30px 0 4px; }
  .speed { font-size:120px; font-weight:800; line-height:.95; letter-spacing:-.03em;
    font-variant-numeric:tabular-nums; }
  .unit { color:var(--dim); font-size:17px; margin-top:6px; }
  .unit b { font-weight:600; }
  .unit .test { color:var(--amber); }


  /* power */
  .power { width:100%; margin-top:20px; border:0; border-radius:20px; padding:24px 16px; font-size:24px; font-weight:800;
    letter-spacing:.04em; color:#fff; background:#3a3a3e; transition:background .15s, transform .05s; }
  .power.on { background:var(--green); }
  .power:active { transform:scale(.98); }
  .power:disabled { opacity:.45; }
  .powerSub { text-align:center; color:var(--dim); font-size:14px; margin-top:10px; min-height:20px; }

  /* test */
  .card { background:var(--card); border:1px solid var(--line); border-radius:16px; padding:14px 16px; margin-top:22px; }
  .switchRow { display:flex; align-items:center; justify-content:space-between; font-size:16px; font-weight:600; }
  .switch { position:relative; width:52px; height:32px; flex:none; }
  .switch input { opacity:0; width:0; height:0; }
  .switch i { position:absolute; inset:0; border-radius:16px; background:#3a3a3e; transition:.15s; }
  .switch i::after { content:""; position:absolute; width:26px; height:26px; left:3px; top:3px;
    border-radius:50%; background:#fff; transition:.15s; }
  .switch input:checked + i { background:var(--amber); }
  .switch input:checked + i::after { transform:translateX(20px); }
  .testBox { margin-top:14px; }
  input[type=range] { width:100%; accent-color:var(--amber); height:32px; }
  .ticks { display:flex; justify-content:space-between; color:var(--dim); font-size:12px; }


  .hint { color:var(--dim); font-size:13px; font-weight:400; margin-left:6px; }
  .hidden { display:none !important; }
  .note { color:var(--dim); font-size:12px; line-height:1.45; text-align:center; margin-top:18px; }
</style>
</head>
<body>

  <div class="top">
    <div class="conn"><div class="dot" id="dot"></div><span id="status">Not connected</span></div>
    <button class="linkBtn" id="connectBtn">Connect</button>
  </div>

  <button class="power" id="powerBtn" disabled>OFF</button>
  <div class="powerSub" id="powerSub">Connect to the ESP32 first</div>

  <div class="speedBox">
    <div class="speed" id="speed">0</div>
    <div class="unit">km/h <span id="src"></span></div>
  </div>



  <div class="card">
    <label class="switchRow">
      <span>Test mode <small class="hint">replaces GPS</small></span>
      <span class="switch"><input type="checkbox" id="testMode"><i></i></span>
    </label>
    <div class="testBox hidden" id="testBox">
      <input type="range" id="testSlider" min="0" max="180" step="1" value="0">
      <div class="ticks"><span>0</span><span>30</span><span>70</span><span>110</span><span>135</span><span>180</span></div>
    </div>
  </div>


  <div class="card batCard">
    <div class="batRow">
      <div class="bat" id="bat"><div class="batIcon"><i id="batFill"></i></div></div>
      <div class="batMain"><div class="batPct" id="batTxt">–</div><div class="batSub" id="batSub">Battery · connect to read</div></div>
    </div>
  </div>

  <div class="note">Keep this page open with the screen on.<br>
  iPhone: open in the Bluefy browser · Android: Chrome.</div>

<script>
// ===== ESP32 link (matches speed_lovespouse.ino) =====
const SERVICE  = '6e1d0001-8b2a-4c1e-9f3a-5a7d2c4b9e10';
const SPEED_CH = '6e1d0002-8b2a-4c1e-9f3a-5a7d2c4b9e10';  // write uint16 km/h x10
const FB_CH    = '6e1d0003-8b2a-4c1e-9f3a-5a7d2c4b9e10';  // notify [pct, mode, ...]
const CTRL_CH  = '6e1d0004-8b2a-4c1e-9f3a-5a7d2c4b9e10';  // write [cmd, value]
// cmd 1 = speed mode (0 = levels), cmd 2 = manual (0 = forced stop, 255 = follow speed)

const $ = id => document.getElementById(id);
let device = null, speedChar = null, ctrlChar = null;
let kmh = 0, lastFix = null, gpsWatch = null, wakeLock = null;
let powerOn = false, toyMode = 0, writing = false, userDisconnect = false;

// ---------- status ----------
function setStatus(text, state = '') {
  $('status').textContent = text;
  $('dot').className = 'dot ' + state;
}

// ---------- GPS (starts on load so you always see your speed) ----------
function startGps() {
  if (gpsWatch != null) return;
  if (!('geolocation' in navigator)) { $('src').textContent = '· no GPS'; return; }
  gpsWatch = navigator.geolocation.watchPosition(onFix,
    e => { $('src').textContent = '· GPS ' + (e.code === 1 ? 'blocked' : 'searching…'); },
    { enableHighAccuracy: true, maximumAge: 0, timeout: 15000 });
}

function onFix(p) {
  if ($('testMode').checked) return;
  let v = p.coords.speed;                                    // m/s, can be null
  if ((v == null || isNaN(v)) && lastFix) {
    const dt = (p.timestamp - lastFix.timestamp) / 1000;
    if (dt > 0) v = dist(lastFix.coords, p.coords) / dt;
  }
  lastFix = p;
  kmh = (v == null || isNaN(v) || v < 0) ? 0 : v * 3.6;
  if (kmh < 2) kmh = 0;                                      // GPS jitter when stopped
  $('src').innerHTML = '· GPS ±' + Math.round(p.coords.accuracy) + ' m';
  render(); send();
}

function dist(a, b) {
  const R = 6371000, r = x => x * Math.PI / 180;
  const dLat = r(b.latitude - a.latitude), dLon = r(b.longitude - a.longitude);
  const h = Math.sin(dLat/2)**2 + Math.cos(r(a.latitude)) * Math.cos(r(b.latitude)) * Math.sin(dLon/2)**2;
  return 2 * R * Math.asin(Math.sqrt(h));
}

// ---------- Bluetooth ----------
async function connect() {
  if (!navigator.bluetooth) {
    setStatus('No Bluetooth here – use Bluefy (iPhone) or Chrome (Android)', 'err');
    return;
  }
  try {
    setStatus('Searching…', 'busy');
    device = await navigator.bluetooth.requestDevice({ filters: [{ services: [SERVICE] }] });
    device.addEventListener('gattserverdisconnected', onDisconnected);
    userDisconnect = false;
    setPower(false);                                         // always start OFF
    await openGatt();
    startGps();
    keepAwake();
  } catch (e) {
    setStatus(e.name === 'NotFoundError' ? 'Not connected' : e.message, e.name === 'NotFoundError' ? '' : 'err');
  }
  updateUi();
}

async function openGatt() {
  setStatus('Connecting…', 'busy');
  const server = await device.gatt.connect();
  const svc = await server.getPrimaryService(SERVICE);
  speedChar = await svc.getCharacteristic(SPEED_CH);
  ctrlChar  = await svc.getCharacteristic(CTRL_CH);
  try {
    const fb = await svc.getCharacteristic(FB_CH);
    await fb.startNotifications();
    fb.addEventListener('characteristicvaluechanged', e => {
      const v = e.target.value;
      toyMode = v.byteLength > 1 ? v.getUint8(1) : 0;
      if (v.byteLength >= 7) showBattery(v.getUint8(6), v.getUint16(4, true));
      render();
    });
  } catch (_) {}
  setStatus('Connected', 'ok');
  await ctrl(1, 0);                                          // levels mode (your table)
  await applyPower();                                        // re-send ON/OFF after (re)connect
  send();
  updateUi();
}

// battery: pct 255 = monitor disabled in firmware
function showBattery(pct, mv) {
  const el = $('bat');
  if (pct == null || pct === 255 || !mv) {
    el.className = 'bat';
    $('batFill').style.width = '0';
    $('batTxt').textContent = '–';
    $('batSub').textContent = pct === 255 ? 'Battery · monitor disabled in firmware' : 'Battery · connect to read';
    return;
  }
  pct = Math.max(0, Math.min(100, pct));
  el.className = 'bat ' + (pct <= 15 ? 'low' : pct <= 35 ? 'mid' : 'ok');
  $('batFill').style.width = (pct * 0.42) + 'px';
  $('batTxt').textContent = pct + '%';
  $('batSub').textContent = 'Battery · ' + (mv / 1000).toFixed(2) + ' V' + (mv >= 4150 ? ' · charging / full' : pct <= 15 ? ' · charge soon' : '');
}

async function onDisconnected() {
  speedChar = null; ctrlChar = null; toyMode = 0;
  showBattery(null, 0);
  updateUi(); render();
  if (userDisconnect) return;
  setStatus('Link lost – reconnecting…', 'err');
  for (let i = 0; i < 20 && !userDisconnect; i++) {
    try { await openGatt(); return; } catch (_) { await new Promise(r => setTimeout(r, 1500)); }
  }
  setStatus('Lost – tap Connect', 'err');
}

async function disconnect() {
  userDisconnect = true;
  setPower(false);
  await applyPower();                                        // stop the toy before leaving
  if (device && device.gatt.connected) device.gatt.disconnect();
  if (wakeLock) { try { wakeLock.release(); } catch (_) {} wakeLock = null; }
  setStatus('Not connected');
  updateUi();
}

// speed write (also the keepalive: the ESP32 stops everything after 3 s of silence)
async function send() {
  if (!speedChar || writing) return;
  writing = true;
  const raw = Math.max(0, Math.min(65535, Math.round(kmh * 10)));
  const buf = new Uint8Array([raw & 0xff, raw >> 8]);
  try {
    if (speedChar.writeValueWithoutResponse) await speedChar.writeValueWithoutResponse(buf);
    else await speedChar.writeValue(buf);
  } catch (_) {}
  writing = false;
}
setInterval(send, 1000);

let ctrlQueue = Promise.resolve();
function ctrl(cmd, val) {
  if (!ctrlChar) return Promise.resolve();
  const c = ctrlChar;
  ctrlQueue = ctrlQueue.then(() => c.writeValue(new Uint8Array([cmd, val]))).catch(() => {});
  return ctrlQueue;
}

// ---------- ON / OFF ----------
// OFF = firmware "manual strength 0": toy stopped, speed ignored.
// ON  = firmware follows your speed table.
function setPower(on) { powerOn = on; updateUi(); render(); }
function applyPower() { return ctrl(2, powerOn ? 255 : 0); }

$('powerBtn').onclick = async () => {
  setPower(!powerOn);
  if (navigator.vibrate) navigator.vibrate(30);
  await applyPower();
};

// ---------- screen wake lock ----------
async function keepAwake() {
  try { if ('wakeLock' in navigator) wakeLock = await navigator.wakeLock.request('screen'); } catch (_) {}
}
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && speedChar) keepAwake();
});

// ---------- UI ----------
function updateUi() {
  const linked = !!speedChar;
  $('connectBtn').textContent = linked ? 'Disconnect' : 'Connect';
  $('powerBtn').disabled = !linked;
  $('powerBtn').textContent = powerOn ? 'ON' : 'OFF';
  $('powerBtn').classList.toggle('on', powerOn);
  $('powerSub').textContent = !linked ? 'Connect to the ESP32 first'
    : powerOn ? 'Following your speed' : 'Toy stopped – speed ignored';
}

function render() {
  $('speed').textContent = Math.round(kmh);
}

$('connectBtn').onclick = () => (device && device.gatt.connected) ? disconnect() : connect();

$('testMode').onchange = e => {
  const on = e.target.checked;
  $('testBox').classList.toggle('hidden', !on);
  kmh = on ? +$('testSlider').value : (lastFix && lastFix.coords.speed > 0 ? lastFix.coords.speed * 3.6 : 0);
  $('src').innerHTML = on ? '· <b class="test">TEST</b>' : '· GPS';
  render(); send();
};
$('testSlider').oninput = e => { kmh = +e.target.value; render(); send(); };

startGps();
updateUi(); render();
</script>
</body>
</html>
